<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Habit Tracker">
<meta name="theme-color" content="#ffffff">
<title>Habit Tracker</title>
<style>
  :root{--bg:#ffffff;--bg2:#f5f5f4;--bg3:#e7e5e4;--text1:#1c1917;--text2:#78716c;--text3:#a8a29e;--border:#e7e5e4;--border2:#d6d3d1;--r-sm:6px;--r-md:10px;--r-lg:14px;}
  @media(prefers-color-scheme:dark){:root{--bg:#1c1917;--bg2:#292524;--bg3:#44403c;--text1:#fafaf9;--text2:#a8a29e;--text3:#78716c;--border:#44403c;--border2:#57534e;}}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:var(--bg);color:var(--text1);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;}
  #app{max-width:430px;margin:0 auto;padding:env(safe-area-inset-top,16px) 0 env(safe-area-inset-bottom,16px);min-height:100vh;}
  .screen{padding:16px 16px 40px;}

  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .top-bar h1{font-size:17px;font-weight:600;color:var(--text1);letter-spacing:-0.02em;}
  .top-right{display:flex;align-items:center;gap:8px;}
  .tab-group{display:flex;background:var(--bg2);border-radius:var(--r-md);padding:2px;gap:2px;}
  .tab-btn{background:none;border:none;padding:5px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);border-radius:8px;font-family:inherit;transition:all .15s;}
  .tab-btn.active{background:var(--bg);color:var(--text1);box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .kebab-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:18px;padding:4px 6px;line-height:1;border-radius:var(--r-sm);}
  .kebab-btn:active{background:var(--bg2);}

  .menu-overlay{position:fixed;inset:0;z-index:100;}
  .menu-popup{position:fixed;top:56px;right:16px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden;z-index:101;min-width:160px;}
  .menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:13px 16px;background:none;border:none;font-family:inherit;font-size:14px;font-weight:500;color:var(--text1);cursor:pointer;text-align:left;}
  .menu-item:not(:last-child){border-bottom:1px solid var(--border);}
  .menu-item:active{background:var(--bg2);}
  .menu-icon{font-size:16px;}

  .week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .period-block{display:flex;flex-direction:column;align-items:center;gap:1px;}
  .period-year{font-size:11px;color:var(--text3);}
  .period-label{font-size:20px;font-weight:600;color:var(--text1);letter-spacing:-0.03em;}
  .period-range{font-size:10px;color:var(--text3);text-align:center;}
  .arrow-btn{background:var(--bg2);border:none;cursor:pointer;color:var(--text2);font-size:18px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .arrow-btn:active{background:var(--bg3);}

  .summary-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat-card{background:var(--bg2);border-radius:var(--r-lg);padding:12px 14px;}
  .stat-label{font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500;}
  .stat-value{font-size:24px;font-weight:600;color:var(--text1);letter-spacing:-0.02em;}
  .stat-unit{font-size:13px;font-weight:400;color:var(--text2);}

  .month-rates{background:var(--bg2);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:16px;}
  .month-rates-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em;}
  .rate-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .rate-row:last-child{margin-bottom:0;}
  .rate-name{font-size:12px;color:var(--text2);width:58px;flex-shrink:0;}
  .rate-bar-wrap{flex:1;height:5px;background:var(--bg3);border-radius:99px;overflow:hidden;}
  .rate-bar{height:100%;border-radius:99px;transition:width .4s ease;}
  .rate-pct{font-size:12px;font-weight:600;color:var(--text1);min-width:32px;text-align:right;}

  .cat-section{margin-bottom:20px;}
  .cat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cat-title-wrap{display:flex;align-items:center;gap:7px;}
  .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .cat-name-text{font-size:13px;font-weight:600;color:var(--text2);}
  .cat-name-input{font-size:13px;font-weight:600;color:var(--text1);border:none;border-bottom:1.5px solid var(--border2);background:transparent;outline:none;width:110px;font-family:inherit;padding:0;}
  .cat-rate-badge{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;}

  .habit-table{width:100%;border-collapse:collapse;table-layout:fixed;}
  .day-header{text-align:center;font-size:10px;font-weight:500;color:var(--text3);padding-bottom:5px;}
  .day-header.today{font-weight:700;}
  .name-cell{font-size:12px;color:var(--text1);padding-right:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;font-weight:500;}
  .day-td{width:28px;padding:2px;vertical-align:middle;}
  .streak-td{width:36px;padding-left:3px;vertical-align:middle;}
  .day-cell{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--bg2);user-select:none;transition:transform .1s;margin:auto;color:transparent;}
  .day-cell.done{color:#fff;border-color:transparent;}
  .day-cell.skip{opacity:0.18;cursor:default;pointer-events:none;}
  .day-cell:active{transform:scale(.85);}
  .streak-pill{font-size:10px;font-weight:500;padding:2px 6px;border-radius:20px;white-space:nowrap;display:inline-block;}
  .habit-tr td{padding-top:3px;padding-bottom:3px;}

  /* Edit mode */
  .habit-edit-list{display:flex;flex-direction:column;gap:10px;}
  .habit-edit-row{display:flex;align-items:flex-start;gap:8px;}
  .minus-btn{width:20px;height:20px;border-radius:50%;border:1px solid var(--border2);background:none;cursor:pointer;color:var(--text3);display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;padding:0;flex-shrink:0;margin-top:4px;}
  .minus-btn:active{background:#fee2e2;color:#dc2626;border-color:#fca5a5;}
  .habit-edit-fields{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
  .habit-name-input{font-size:13px;color:var(--text1);border:none;border-bottom:1px solid var(--border);background:transparent;outline:none;width:100%;font-family:inherit;padding:2px 0;}
  .freq-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .freq-label{font-size:11px;color:var(--text3);}
  .freq-select{font-size:11px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:2px 6px;font-family:inherit;cursor:pointer;outline:none;}

  /* 요일 선택 토글 */
  .days-picker{display:flex;gap:4px;margin-top:2px;flex-wrap:wrap;}
  .day-toggle{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);color:var(--text3);font-size:11px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:all .15s;flex-shrink:0;}
  .day-toggle.on{color:#fff;border-color:transparent;}
  .day-toggle:active{transform:scale(.9);}

  .add-habit-row{display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer;padding:2px 0;}
  .add-habit-btn{width:20px;height:20px;border-radius:50%;border:1px solid var(--border2);background:none;cursor:pointer;color:var(--text3);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;padding:0;flex-shrink:0;}
  .add-habit-label{font-size:12px;color:var(--text3);}
  .edit-row{display:flex;justify-content:flex-end;margin-top:10px;}
  .edit-btn{background:none;border:none;padding:0;font-size:11px;color:var(--text3);cursor:pointer;font-family:inherit;}
  .edit-btn.active{color:var(--text1);font-weight:600;}

  .month-rate-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .cal-wrap{margin-bottom:16px;}
  .cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
  .cal-dow{text-align:center;font-size:10px;font-weight:600;color:var(--text3);padding-bottom:4px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;}
  .cal-num{font-size:12px;color:var(--text2);font-weight:400;}
  .cal-num.today{font-weight:700;color:var(--text1);}
  .cal-num.other-month{color:var(--text3);opacity:.4;}
  .cal-dots{display:flex;gap:2px;align-items:center;justify-content:center;}
  .cal-dot{width:6px;height:6px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);flex-shrink:0;}
  .cal-dot.lit{border-color:transparent;}
  .month-legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);font-weight:500;}
  .legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

  .toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--text1);color:var(--bg);font-size:13px;font-weight:500;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:999;}
  .toast.show{opacity:1;}
  .install-banner{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:var(--r-lg);padding:12px 14px;margin-bottom:16px;font-size:12px;color:#166534;display:flex;align-items:flex-start;gap:8px;}
  .install-banner b{display:block;margin-bottom:2px;font-size:13px;}
  .install-close{margin-left:auto;background:none;border:none;color:#166534;cursor:pointer;font-size:16px;padding:0;flex-shrink:0;}
</style>
</head>
<body>
<div id="app">
  <div class="screen">
    <div class="top-bar">
      <h1>Habit Tracker</h1>
      <div class="top-right">
        <div class="tab-group">
          <button class="tab-btn active" id="tab-week">주간</button>
          <button class="tab-btn" id="tab-month">월간</button>
        </div>
        <button class="kebab-btn" onclick="toggleMenu()">⋯</button>
      </div>
    </div>
    <div class="menu-overlay" id="menu-overlay" style="display:none" onclick="closeMenu()"></div>
    <div class="menu-popup" id="menu-popup" style="display:none">
      <button class="menu-item" onclick="exportData();closeMenu()"><span class="menu-icon">💾</span>백업하기</button>
      <button class="menu-item" onclick="document.getElementById('import-input').click();closeMenu()"><span class="menu-icon">📂</span>복원하기</button>
    </div>
    <div id="install-banner" class="install-banner" style="display:none">
      <div><b>📲 홈 화면에 추가하기</b>Safari 하단 공유 버튼 → "홈 화면에 추가"</div>
      <button class="install-close" onclick="dismissBanner()">✕</button>
    </div>
    <div class="week-nav">
      <button class="arrow-btn" id="prev-btn">‹</button>
      <div class="period-block">
        <span class="period-year" id="period-year"></span>
        <span class="period-label" id="period-label"></span>
        <span class="period-range" id="period-range"></span>
      </div>
      <button class="arrow-btn" id="next-btn">›</button>
    </div>
    <div id="view-weekly"></div>
    <div id="view-monthly"></div>
  </div>
</div>
<input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">
<div class="toast" id="toast"></div>

<script>
const TODAY = new Date();
// 월~일 순서 (테이블 표시용)
const DAYS_KO = ['일','월','화','수','목','금','토'];
// 월요일=0 ~ 일요일=6 (내부 인덱스, JS getDay와 다름)
// JS getDay: 0=일,1=월...6=토
// 우리 주 표시: 월화수목금토일 (i=0~6, 실제 JS요일: 1,2,3,4,5,6,0)
const WEEK_ORDER = [1,2,3,4,5,6,0]; // 월~일의 JS getDay 값
const WEEK_LABELS = ['월','화','수','목','금','토','일'];

let mode='week', weekOffset=0, monthOffset=0, editMode=false;

const DEFAULT_CATS = [
  {id:'body',name:'신체건강',color:'#1D9E75',bg:'#E1F5EE',textColor:'#085041',
    habits:[{name:'운동 30분',days:[1,2,3,4,5,6,0],done:{}},{name:'물 2L',days:[1,2,3,4,5,6,0],done:{}},{name:'7시간 수면',days:[1,2,3,4,5,6,0],done:{}}]},
  {id:'mind',name:'정신건강',color:'#7F77DD',bg:'#EEEDFE',textColor:'#26215C',
    habits:[{name:'명상 10분',days:[1,2,3,4,5,6,0],done:{}},{name:'일기 쓰기',days:[1,2,3,4,5,6,0],done:{}}]},
  {id:'brain',name:'두뇌건강',color:'#378ADD',bg:'#E6F1FB',textColor:'#042C53',
    habits:[{name:'피아노 연습',days:[1,2,3,4,5,6,0],done:{}},{name:'독서 20분',days:[1,2,3,4,5,6,0],done:{}}]},
];

// days: JS getDay 값 배열 ex) [1,3,5] = 월수금
function defaultDays(){ return [1,2,3,4,5,6,0]; }

function loadData(){
  try{
    const raw=localStorage.getItem('habit_tracker_v3');
    if(raw){
      const d=JSON.parse(raw);
      // 마이그레이션: freq→days
      d.cats.forEach(cat=>cat.habits.forEach(h=>{
        if(!h.days){
          const freq=h.freq||7;
          h.days=freq===7?defaultDays():WEEK_ORDER.slice(0,freq);
          delete h.freq;
        }
      }));
      return d;
    }
    // v2 마이그레이션
    const v2=localStorage.getItem('habit_tracker_v2');
    if(v2){
      const d=JSON.parse(v2);
      d.cats.forEach(cat=>cat.habits.forEach(h=>{
        const freq=h.freq||7;
        h.days=freq===7?defaultDays():WEEK_ORDER.slice(0,freq);
        delete h.freq;
      }));
      return {cats:d.cats,archived:d.archived||[]};
    }
  }catch(e){}
  return {cats:JSON.parse(JSON.stringify(DEFAULT_CATS)),archived:[]};
}
function saveData(){
  localStorage.setItem('habit_tracker_v3',JSON.stringify({cats:CATS,archived:ARCHIVED}));
}
let {cats:CATS,archived:ARCHIVED}=loadData();

function exportData(){
  const blob=new Blob([JSON.stringify({version:3,cats:CATS,archived:ARCHIVED,exported:new Date().toISOString()},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const t=new Date();
  a.href=url;
  a.download=`habit-tracker-${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}.json`;
  a.click();URL.revokeObjectURL(url);
  showToast('💾 백업됐어요! iCloud Drive에 저장해두세요');
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.cats){
        CATS=d.cats;ARCHIVED=d.archived||[];
        CATS.forEach(cat=>cat.habits.forEach(h=>{if(!h.days)h.days=defaultDays();}));
        saveData();render();showToast('✅ 데이터가 복원됐어요!');
      }
    }catch(err){showToast('❌ 파일을 읽을 수 없어요');}
  };
  reader.readAsText(file);e.target.value='';
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function dismissBanner(){
  document.getElementById('install-banner').style.display='none';
  localStorage.setItem('banner_dismissed','1');
}
function checkBanner(){
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone=window.navigator.standalone;
  const dismissed=localStorage.getItem('banner_dismissed');
  if(isIOS&&!isStandalone&&!dismissed)document.getElementById('install-banner').style.display='flex';
}
function toggleMenu(){
  const p=document.getElementById('menu-popup'),o=document.getElementById('menu-overlay');
  const open=p.style.display!=='none';
  p.style.display=open?'none':'block';o.style.display=open?'none':'block';
}
function closeMenu(){
  document.getElementById('menu-popup').style.display='none';
  document.getElementById('menu-overlay').style.display='none';
}

function dateKey(d){return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;}
function getWeekDates(off){
  const d=new Date(TODAY);d.setDate(d.getDate()+off*7);
  const day=d.getDay();
  const mon=new Date(d);mon.setDate(d.getDate()-day+(day===0?-6:1));
  return Array.from({length:7},(_,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return x;});
}
function weekLabel(dates){
  // 기준 달 결정: 오늘이 이 주에 속하면 오늘 달, 아니면 더 많은 날이 속한 달
  let refMonth;
  const todayInWeek = dates.find(d=>d.toDateString()===TODAY.toDateString());
  if(todayInWeek){
    refMonth = TODAY.getMonth();
  } else {
    const counts={};
    dates.forEach(d=>{ const m=d.getMonth(); counts[m]=(counts[m]||0)+1; });
    refMonth = parseInt(Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0]);
  }
  // 해당 달에서 몇 번째 주인지: 그 달의 첫 번째 월요일 기준
  const firstOfMonth = new Date(dates[0].getFullYear(), refMonth, 1);
  // 주차: 해당 달에서 이 주의 월요일(또는 1일)이 몇 번째 주인지
  const monday = dates[0]; // 주의 시작(월요일)
  // refMonth의 첫날부터 이 주 월요일까지 며칠인지
  const firstDay = new Date(firstOfMonth.getFullYear(), refMonth, 1);
  // 첫째 주 월요일 찾기
  const firstDow = firstDay.getDay(); // 0=일
  const daysToMon = firstDow===0 ? 1 : (firstDow===1 ? 0 : 8-firstDow);
  const firstMon = new Date(firstDay); firstMon.setDate(1+daysToMon-(firstDow===1?0:0));
  // 더 단순하게: 월요일 날짜 기준으로 해당 달의 몇 번째 월요일인지 역산
  // refMonth의 1일이 어느 요일인지 보고, 이 주 월요일이 몇번째 주인지
  const mondayDate = monday.getDate();
  const mondayMonth = monday.getMonth();
  let weekNum;
  if(mondayMonth !== refMonth){
    // 월요일이 이전 달 → 1주차
    weekNum = 1;
  } else {
    weekNum = Math.ceil(mondayDate / 7);
  }
  return { label:`${refMonth+1}월 ${weekNum}주차`, month: refMonth };
}

function rangeStr(dates){
  const s=dates[0], e=dates[6];
  const sy=String(s.getFullYear()).slice(2);
  const sm=s.getMonth()+1, sd=s.getDate();
  const em=e.getMonth()+1, ed=e.getDate();
  if(sm===em) return `${sy}.${sm}.${sd}-${ed}`;
  return `${sy}.${sm}.${sd}-${em}.${ed}`;
}

function getMonthDates(y,m){const days=new Date(y,m+1,0).getDate();return Array.from({length:days},(_,i)=>new Date(y,m,i+1));}

// 달성률: 해당 습관의 days에 해당하는 날짜만 분모로
function calcRateDays(habits,dates){
  let done=0,total=0;
  dates.forEach(d=>{
    if(d>TODAY)return;
    const jsDay=d.getDay();
    const k=dateKey(d);
    habits.forEach(h=>{
      const days=h.days||defaultDays();
      if(days.includes(jsDay)){
        total++;
        done+=(h.done[k]||0);
      }
    });
  });
  return total===0?null:Math.round(done/total*100);
}

function calcStreak(h){
  const days=h.days||defaultDays();
  let s=0,d=new Date(TODAY);
  let checked=0;
  while(checked<500){
    checked++;
    if(days.includes(d.getDay())){
      if(h.done[dateKey(d)]){s++;d.setDate(d.getDate()-1);}
      else break;
    }else{
      d.setDate(d.getDate()-1);
    }
  }
  return s;
}

function setPeriod(yearTxt, labelTxt, rangeTxt){
  document.getElementById('period-year').textContent=yearTxt;
  document.getElementById('period-label').textContent=labelTxt;
  const re=document.getElementById('period-range');
  if(re) re.textContent=rangeTxt||'';
}

function freqLabel(days){
  if(!days||days.length===7)return '매일';
  return `주 ${days.length}회`;
}

// ── 주간 뷰 ────────────────────────────────────
function renderWeekly(){
  const el=document.getElementById('view-weekly');el.innerHTML='';
  const wd=getWeekDates(weekOffset);
  const todayIdx=wd.findIndex(d=>d.toDateString()===TODAY.toDateString());
  const pastWeek=wd.filter(d=>d<=TODAY);
  const allH=CATS.flatMap(c=>c.habits);
  const monthDates=getMonthDates(TODAY.getFullYear(),TODAY.getMonth());
  const wl=weekLabel(wd);
  setPeriod(`${wd[0].getFullYear()}년`, wl.label, rangeStr(wd));

  const todayDone=allH.filter(h=>h.done[dateKey(TODAY)]).length;
  const weekRate=calcRateDays(allH,pastWeek);

  const sumEl=document.createElement('div');sumEl.className='summary-row';
  sumEl.innerHTML=`
    <div class="stat-card"><div class="stat-label">오늘 달성</div>
      <div class="stat-value">${todayDone}<span class="stat-unit">/${allH.length}</span></div></div>
    <div class="stat-card"><div class="stat-label">이번 주 달성률</div>
      <div class="stat-value">${weekRate!==null?weekRate:'—'}<span class="stat-unit">${weekRate!==null?'%':''}</span></div></div>`;
  el.appendChild(sumEl);

  const ratesBox=document.createElement('div');ratesBox.className='month-rates';
  const rateItems=[
    ...CATS.map(cat=>({name:cat.name,rate:calcRateDays(cat.habits,monthDates),color:cat.color})),
    {name:'전체',rate:calcRateDays(allH,monthDates),color:'#78716c'}
  ];
  let rHtml=`<div class="month-rates-title">${TODAY.getMonth()+1}월 달성률</div>`;
  rateItems.forEach(item=>{
    const r=item.rate??0;
    rHtml+=`<div class="rate-row">
      <span class="rate-name">${item.name}</span>
      <div class="rate-bar-wrap"><div class="rate-bar" style="width:${r}%;background:${item.color}"></div></div>
      <span class="rate-pct">${item.rate!==null?item.rate+'%':'—'}</span></div>`;
  });
  ratesBox.innerHTML=rHtml;el.appendChild(ratesBox);

  CATS.forEach((cat,catIdx)=>{
    const catRate=calcRateDays(cat.habits,pastWeek);
    const sec=document.createElement('div');sec.className='cat-section';

    const hdr=document.createElement('div');hdr.className='cat-header';
    const tw=document.createElement('span');tw.className='cat-title-wrap';
    const dot=document.createElement('span');dot.className='cat-dot';dot.style.background=cat.color;tw.appendChild(dot);
    if(editMode){
      const inp=document.createElement('input');inp.className='cat-name-input';inp.value=cat.name;
      inp.oninput=e=>{cat.name=e.target.value;saveData();};tw.appendChild(inp);
    }else{
      const ns=document.createElement('span');ns.className='cat-name-text';ns.textContent=cat.name;tw.appendChild(ns);
    }
    hdr.appendChild(tw);
    if(!editMode){
      const badge=document.createElement('span');badge.className='cat-rate-badge';
      badge.style.background=cat.bg;badge.style.color=cat.textColor;
      badge.textContent=`이번 주 ${catRate!==null?catRate+'%':'—'}`;hdr.appendChild(badge);
    }
    sec.appendChild(hdr);

    if(editMode){
      const list=document.createElement('div');list.className='habit-edit-list';
      cat.habits.forEach((h,hIdx)=>{
        const days=h.days||defaultDays();
        const row=document.createElement('div');row.className='habit-edit-row';

        const mb=document.createElement('button');mb.className='minus-btn';mb.textContent='−';
        mb.onclick=()=>{
          const hasRecord=Object.keys(h.done).some(k=>h.done[k]);
          if(hasRecord) ARCHIVED.push({...h,catName:cat.name,catColor:cat.color,deletedAt:new Date().toISOString()});
          cat.habits.splice(hIdx,1);saveData();renderWeekly();
        };

        const fields=document.createElement('div');fields.className='habit-edit-fields';

        const nameInp=document.createElement('input');nameInp.className='habit-name-input';nameInp.value=h.name;
        nameInp.oninput=e=>{h.name=e.target.value;saveData();};

        const freqRow=document.createElement('div');freqRow.className='freq-row';
        const freqLbl=document.createElement('span');freqLbl.className='freq-label';freqLbl.textContent='목표:';

        // 빈도 표시 (읽기 전용 라벨)
        const freqVal=document.createElement('span');freqVal.className='freq-label';
        freqVal.style.color='var(--text2)';freqVal.style.fontWeight='500';
        freqVal.textContent=freqLabel(days);

        freqRow.appendChild(freqLbl);freqRow.appendChild(freqVal);

        // 요일 토글 버튼
        const picker=document.createElement('div');picker.className='days-picker';
        WEEK_ORDER.forEach((jsDay,wi)=>{
          const btn=document.createElement('button');
          btn.className='day-toggle'+(days.includes(jsDay)?' on':'');
          btn.textContent=WEEK_LABELS[wi];
          if(days.includes(jsDay)) btn.style.background=cat.color;
          btn.onclick=()=>{
            const idx=h.days.indexOf(jsDay);
            if(idx>=0){
              if(h.days.length>1){ h.days.splice(idx,1); }
              else{ return; } // 최소 1개
            }else{
              h.days.push(jsDay);
              // 순서 정렬
              h.days.sort((a,b)=>WEEK_ORDER.indexOf(a)-WEEK_ORDER.indexOf(b));
            }
            saveData();renderWeekly();
          };
          picker.appendChild(btn);
        });

        fields.appendChild(nameInp);fields.appendChild(freqRow);fields.appendChild(picker);
        row.appendChild(mb);row.appendChild(fields);
        list.appendChild(row);
      });
      sec.appendChild(list);

      const addRow=document.createElement('div');addRow.className='add-habit-row';
      const plusBtn=document.createElement('button');plusBtn.className='add-habit-btn';plusBtn.textContent='+';
      const addLbl=document.createElement('span');addLbl.className='add-habit-label';addLbl.textContent='습관 추가';
      addRow.appendChild(plusBtn);addRow.appendChild(addLbl);
      addRow.onclick=()=>{
        cat.habits.push({name:'새 습관',days:defaultDays(),done:{}});saveData();renderWeekly();
        setTimeout(()=>{const ins=sec.querySelectorAll('.habit-name-input');if(ins.length)ins[ins.length-1].focus();},50);
      };
      sec.appendChild(addRow);
    }else{
      // 일반 뷰
      const table=document.createElement('table');table.className='habit-table';
      const cg=document.createElement('colgroup');
      const cn=document.createElement('col');cn.style.width='auto';cg.appendChild(cn);
      for(let i=0;i<7;i++){const c=document.createElement('col');c.style.width='28px';cg.appendChild(c);}
      const cs=document.createElement('col');cs.style.width='36px';cg.appendChild(cs);
      table.appendChild(cg);

      const thead=document.createElement('thead');const hRow=document.createElement('tr');
      hRow.appendChild(document.createElement('th'));
      wd.forEach((d,i)=>{
        const th=document.createElement('th');
        th.className='day-header'+(i===todayIdx?' today':'');
        th.style.color=i===todayIdx?cat.color:'';
        th.textContent=DAYS_KO[d.getDay()];hRow.appendChild(th);
      });
      hRow.appendChild(document.createElement('th'));
      thead.appendChild(hRow);table.appendChild(thead);

      const tbody=document.createElement('tbody');
      cat.habits.forEach(h=>{
        const days=h.days||defaultDays();
        const tr=document.createElement('tr');tr.className='habit-tr';

        const tdN=document.createElement('td');tdN.className='name-cell';
        if(days.length<7){
          tdN.innerHTML=`${h.name} <span style="font-size:10px;color:var(--text3);font-weight:400;">주${days.length}회</span>`;
        }else{
          tdN.textContent=h.name;
        }
        tr.appendChild(tdN);

        wd.forEach((d,i)=>{
          const k=dateKey(d);
          const jsDay=d.getDay();
          const isActive=days.includes(jsDay);
          const isFuture=d>TODAY;
          const isDone=!!h.done[k];
          const isToday=i===todayIdx;

          const td=document.createElement('td');td.className='day-td';
          const cell=document.createElement('div');
          cell.className='day-cell'+(isDone?' done':(!isActive?' skip':''));
          cell.style.background=isDone?cat.color:'';
          cell.style.borderColor=(isToday&&!isDone&&isActive)?cat.color:'';
          cell.style.opacity=isFuture?'0.3':'1';
          cell.style.cursor=(isFuture||!isActive)?'default':'pointer';
          cell.textContent=isDone?'✓':'';
          cell.style.color=isDone?'#fff':'transparent';
          if(!isFuture&&isActive){
            cell.addEventListener('click',()=>{h.done[k]=h.done[k]?0:1;saveData();renderWeekly();});
          }
          td.appendChild(cell);tr.appendChild(td);
        });

        const tdS=document.createElement('td');tdS.className='streak-td';
        const streak=calcStreak(h);
        if(streak>1){
          const pill=document.createElement('span');pill.className='streak-pill';
          pill.style.background=cat.bg;pill.style.color=cat.textColor;
          pill.textContent=`🔥${streak}`;tdS.appendChild(pill);
        }
        tr.appendChild(tdS);tbody.appendChild(tr);
      });
      table.appendChild(tbody);sec.appendChild(table);
    }

    if(catIdx===CATS.length-1){
      const editRow=document.createElement('div');editRow.className='edit-row';
      const editBtn=document.createElement('button');
      editBtn.className='edit-btn'+(editMode?' active':'');
      editBtn.textContent=editMode?'Done':'Edit';
      editBtn.onclick=()=>{editMode=!editMode;renderWeekly();};
      editRow.appendChild(editBtn);sec.appendChild(editRow);
    }
    el.appendChild(sec);
  });
}

// ── 월간 뷰 ────────────────────────────────────
function renderMonthly(){
  const el=document.getElementById('view-monthly');el.innerHTML='';
  const base=new Date(TODAY.getFullYear(),TODAY.getMonth()+monthOffset,1);
  const year=base.getFullYear(),month=base.getMonth();
  setPeriod(`${year}년`,`${month+1}월`,'');

  const monthDates=getMonthDates(year,month);
  const allH=CATS.flatMap(c=>c.habits);
  const totalRate=calcRateDays(allH,monthDates);

  const cards=document.createElement('div');cards.className='month-rate-cards';
  CATS.forEach(cat=>{
    const rate=calcRateDays(cat.habits,monthDates);const isHigh=(rate??0)>=80;
    const card=document.createElement('div');card.className='stat-card';
    card.style.background=isHigh?cat.bg:'';
    card.innerHTML=`<div class="stat-label" style="${isHigh?'color:'+cat.textColor:''}">${cat.name}</div>
      <div class="stat-value" style="${isHigh?'color:'+cat.textColor:''}">${rate!==null?rate:'—'}<span class="stat-unit" style="${isHigh?'color:'+cat.textColor:''}">${rate!==null?'%':''}</span></div>`;
    cards.appendChild(card);
  });
  const tc=document.createElement('div');tc.className='stat-card';
  tc.innerHTML=`<div class="stat-label">전체</div><div class="stat-value">${totalRate!==null?totalRate:'—'}<span class="stat-unit">${totalRate!==null?'%':''}</span></div>`;
  cards.appendChild(tc);el.appendChild(cards);

  const calWrap=document.createElement('div');calWrap.className='cal-wrap';
  const dowRow=document.createElement('div');dowRow.className='cal-dow-row';
  DAYS_KO.forEach(d=>{const s=document.createElement('div');s.className='cal-dow';s.textContent=d;dowRow.appendChild(s);});
  calWrap.appendChild(dowRow);

  const grid=document.createElement('div');grid.className='cal-grid';
  const firstDow=new Date(year,month,1).getDay();
  const prevMonthDays=new Date(year,month,0).getDate();
  const totalDays=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=firstDow-1;i>=0;i--)cells.push({day:prevMonthDays-i,cur:false});
  for(let i=1;i<=totalDays;i++)cells.push({day:i,cur:true});
  while(cells.length%7!==0)cells.push({day:cells.length-firstDow-totalDays+1,cur:false});

  cells.forEach(cell=>{
    const div=document.createElement('div');div.className='cal-day';
    const d=new Date(year,cell.cur?month:(cell.day>20?month-1:month+1),cell.day);
    const isToday=d.toDateString()===TODAY.toDateString();const isFuture=d>TODAY;
    const numEl=document.createElement('div');
    numEl.className='cal-num'+(isToday?' today':'')+(!cell.cur?' other-month':'');
    numEl.textContent=cell.day;div.appendChild(numEl);
    if(cell.cur&&!isFuture){
      const dotsEl=document.createElement('div');dotsEl.className='cal-dots';
      CATS.forEach(cat=>{
        const catArchived=ARCHIVED.filter(a=>a.catName===cat.name);
        const allCatH=[...cat.habits,...catArchived];
        const jsDay=d.getDay();
        // 해당 요일에 목표인 습관만
        const targetH=allCatH.filter(h=>(h.days||defaultDays()).includes(jsDay));
        if(targetH.length===0)return;
        const doneCount=targetH.filter(h=>h.done[dateKey(d)]).length;
        const pct=Math.round(doneCount/targetH.length*100);
        const dotEl=document.createElement('div');
        dotEl.className='cal-dot'+(pct>=80?' lit':'');
        dotEl.style.background=pct>=80?cat.color:'';
        dotsEl.appendChild(dotEl);
      });
      div.appendChild(dotsEl);
    }else if(cell.cur&&isFuture){
      const ph=document.createElement('div');ph.style.height='6px';div.appendChild(ph);
    }
    grid.appendChild(div);
  });
  calWrap.appendChild(grid);el.appendChild(calWrap);

  const legend=document.createElement('div');legend.className='month-legend';
  CATS.forEach(cat=>{
    legend.innerHTML+=`<div class="legend-item"><span class="legend-dot" style="background:${cat.color}"></span>${cat.name}</div>`;
  });
  el.appendChild(legend);
}

function render(){
  const wv=document.getElementById('view-weekly');
  const mv=document.getElementById('view-monthly');
  if(mode==='week'){wv.style.display='';mv.style.display='none';renderWeekly();}
  else{wv.style.display='none';mv.style.display='';renderMonthly();}
}

document.getElementById('tab-week').onclick=()=>{
  mode='week';
  document.getElementById('tab-week').classList.add('active');
  document.getElementById('tab-month').classList.remove('active');
  render();
};
document.getElementById('tab-month').onclick=()=>{
  mode='month';
  document.getElementById('tab-month').classList.add('active');
  document.getElementById('tab-week').classList.remove('active');
  // 주간에서 보던 달로 월간 offset 맞추기
  const wd=getWeekDates(weekOffset);
  const wl=weekLabel(wd);
  const targetMonth=wl.month; // 주간에서 표시 중인 달 (0-indexed)
  const todayMonth=TODAY.getMonth();
  const todayYear=TODAY.getFullYear();
  const targetYear=wd[0].getFullYear();
  monthOffset=(targetYear-todayYear)*12+(targetMonth-todayMonth);
  render();
};
document.getElementById('prev-btn').onclick=()=>{if(mode==='week')weekOffset--;else monthOffset--;render();};
document.getElementById('next-btn').onclick=()=>{if(mode==='week')weekOffset++;else monthOffset++;render();};

checkBanner();
render();
</script>
